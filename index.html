<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>私铁经营（暂名）</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <header id="topbar">
        <div class="box grow" id="box-money"></div>
        <div class="box grow" id="box-date"></div>
        <div class="box" id="box-speed" role="group" aria-label="时间速度"></div>
      </header>

      <nav id="toolbar" aria-label="工具栏"></nav>

      <section id="sheet" class="hidden" aria-live="polite">
        <div class="grab" aria-hidden="true"></div>
        <div class="sheet-head">
          <span class="sheet-icon" id="sheet-icon"></span>
          <div class="sheet-titles">
            <h2 id="sheet-title"></h2>
            <p id="sheet-sub"></p>
          </div>
          <button type="button" class="sheet-close" aria-label="关闭">✕</button>
        </div>
        <div id="sheet-body"></div>
      </section>

      <div id="toast" role="status"></div>
      <div id="fps" class="hidden"></div>
      <div id="loading">正在生成地图…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
